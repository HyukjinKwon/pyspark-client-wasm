# SPDX-License-Identifier: Apache-2.0
#
# Envoy config for pyspark-connect-web (lane 5).
#
# Two listeners:
#   * :8081  grpc-web endpoint  -> Spark Connect gRPC server (upstream :15002)
#            with the grpc_web filter + permissive CORS. This is what the
#            browser client talks to: sc://localhost:8081/;transport=grpcweb
#   * :8000  static file server for the JupyterLite site, serving the
#            MANDATORY cross-origin-isolation headers (DECISIONS.md #4):
#                Cross-Origin-Opener-Policy: same-origin
#                Cross-Origin-Embedder-Policy: credentialless
#            SharedArrayBuffer (the Atomics/SAB blocking bridge) refuses to
#            work without crossOriginIsolated === true, so these are not
#            optional - e2e asserts crossOriginIsolated before importing.
#
# Upstream Spark Connect server gRPC address is configured via the
# `spark-connect` cluster at the bottom (default host `spark`, port 15002 -
# overridden in compose.yaml to point at the connect-server container).
#
# Bring up with deploy/compose.yaml; see deploy/README.md.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    # ---------------------------------------------------------------------
    # grpc-web endpoint  (browser client -> Spark Connect)
    # ---------------------------------------------------------------------
    - name: grpcweb_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8081 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpcweb
                codec_type: AUTO
                # Spark Connect streams ExecutePlan/ReattachExecute responses;
                # don't let Envoy buffer/timeout long-lived streams. 0 = no
                # idle timeout on the stream route below.
                stream_idle_timeout: 0s
                route_config:
                  name: grpcweb_route
                  virtual_hosts:
                    - name: grpcweb_host
                      domains: ["*"]
                      # The calling page is cross-origin isolated (COOP/COEP).
                      # Cross-Origin-Resource-Policy: cross-origin lets that page
                      # read this cross-origin grpc-web response under COEP.
                      response_headers_to_add:
                        - header:
                            key: "Cross-Origin-Resource-Policy"
                            value: "cross-origin"
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      # Permissive CORS for the grpc-web endpoint so a browser
                      # served from any origin (e.g. the :8000 static host, or
                      # a JupyterLite deployment elsewhere) can call it.
                      cors:
                        allow_origin_string_match:
                          - safe_regex:
                              regex: ".*"
                        allow_methods: "GET, POST, OPTIONS"
                        allow_headers: >-
                          keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,
                          x-grpc-web,x-user-agent,grpc-timeout,authorization,x-spark-connect-session-id
                        expose_headers: "grpc-status,grpc-message,x-spark-connect-session-id"
                        max_age: "1728000"
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: spark-connect
                            # gRPC/streaming can run long; disable per-route timeout.
                            timeout: 0s
                            max_stream_duration:
                              grpc_timeout_header_max: 0s
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ---------------------------------------------------------------------
    # static site host  (JupyterLite) with COOP/COEP - DECISIONS.md #4
    # ---------------------------------------------------------------------
    - name: static_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: static
                codec_type: AUTO
                route_config:
                  name: static_route
                  virtual_hosts:
                    - name: static_host
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: static-site }
                          # MANDATORY cross-origin isolation headers for SAB.
                          response_headers_to_add:
                            - header:
                                key: "Cross-Origin-Opener-Policy"
                                value: "same-origin"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header:
                                key: "Cross-Origin-Embedder-Policy"
                                value: "credentialless"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            # Allow the page to embed cross-origin resources it
                            # marks as crossorigin (e.g. CDN wheels) under COEP.
                            - header:
                                key: "Cross-Origin-Resource-Policy"
                                value: "cross-origin"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # Upstream Spark Connect gRPC server (HTTP/2). In compose.yaml the address
    # resolves to the connect-server container on port 15002.
    - name: spark-connect
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      # Spark Connect is plain gRPC over HTTP/2 (h2c, no TLS) inside the compose
      # network; explicit_http_config below forces HTTP/2.
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: spark-connect
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      # Overridden by compose DNS to the connect-server service.
                      address: spark-connect
                      port_value: 15002

    # Static file server (a tiny sidecar that serves the built JupyterLite site
    # over HTTP/1.1). compose.yaml runs an http-server container as `static`.
    - name: static-site
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: static-site
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: static
                      port_value: 80
