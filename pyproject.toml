# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-connect-web"
version = "0.0.1.dev0"
description = "Run the PySpark Connect client in JupyterLite/Pyodide via a grpc-web transport (PySpark in JupyterLite)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Hyukjin Kwon" }]
# pyspark is a runtime dep but is provided by the Pyodide environment (and pinned
# by install()); we do NOT depend on grpcio - it is not available in Pyodide.
dependencies = []

[project.optional-dependencies]
# local dev/test only; the browser gets these from Pyodide.
# googleapis-common-protos is pure-Python and required by pyspark.sql.connect
# (google.rpc.* protos); grpcio / grpcio-status are intentionally absent - the
# _grpc_shim stubs them, mirroring Pyodide.
dev = [
    "pyspark>=4.0",
    "pyarrow>=22",
    "pandas",
    "protobuf>=7",
    "googleapis-common-protos>=1.56.4",
    "zstandard>=0.25.0",
    "pytest",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/HyukjinKwon/pyspark-client-wasm"
Repository = "https://github.com/HyukjinKwon/pyspark-client-wasm"
Documentation = "https://hyukjinkwon.github.io/pyspark-client-wasm/"
Changelog = "https://github.com/HyukjinKwon/pyspark-client-wasm/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["pyspark_connect_web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pyspark_connect_web"]
branch = true
# browser-only (imports the `js` FFI / needs cross-origin isolation); covered by e2e
omit = ["pyspark_connect_web/worker/kernel_bootstrap.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
